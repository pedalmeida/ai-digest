name: Daily AI Digest

on:
  schedule:
    - cron: '0 7 * * *'  # 7am UTC = 8am Lisbon (WEST, UTC+1, Apr-Oct)
  workflow_dispatch:       # manual "Run workflow" button in GitHub UI

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm install

      - name: Fetch feed (X + podcasts + RSS + Hacker News + GitHub Trending)
        timeout-minutes: 8
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node scripts/fetch-my-feed.js

      # Optional enrichment: /last30days engagement sweep (Reddit, HN, GitHub,
      # Polymarket). Gated on the LAST30DAYS_ENABLED repo variable so it can be
      # switched off without a code change, and non-fatal so a bad run on a
      # third-party engine can never cost Pedro his morning digest.
      - name: Set up Python (last30days engine)
        if: vars.LAST30DAYS_ENABLED == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out last30days engine
        if: vars.LAST30DAYS_ENABLED == '1'
        uses: actions/checkout@v4
        with:
          repository: mvanhorn/last30days-skill
          ref: v3.21.1          # pinned: never track a moving default branch
          path: .last30days

      - name: Enrich feed with community signal
        if: vars.LAST30DAYS_ENABLED == '1'
        continue-on-error: true
        timeout-minutes: 10
        env:
          LAST30DAYS_ENABLED: '1'
          LAST30DAYS_ENGINE: .last30days/skills/last30days/scripts/last30days.py
          LAST30DAYS_DOMAINS: ${{ vars.LAST30DAYS_DOMAINS || 'AI agents' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-last30days.js

      - name: Debug feed contents
        run: |
          node -e "
            const d = JSON.parse(require('fs').readFileSync('my-feed.json', 'utf8'));
            console.log(JSON.stringify(d.stats));
            console.log(JSON.stringify(d.health));
          "

      - name: Generate digest (Claude Sonnet 5)
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX:      ${{ secrets.GOOGLE_SEARCH_CX }}
          YOUTUBE_API_KEY:       ${{ secrets.YOUTUBE_API_KEY }}
        run: cat my-feed.json | node scripts/remix-digest.js

      - name: Build reading page
        run: node scripts/generate-slides.js

      - name: Commit and push
        run: |
          git config user.name "AI Digest Bot"
          git config user.email "bot@ai-digest.local"
          git add index.html digest-draft.json state/seen.json
          git diff --staged --quiet || git commit -m "digest: $(date +%Y-%m-%d)"
          git push

      - name: Send Telegram notification (success)
        if: success()
        run: |
          MSG=$(node scripts/build-telegram-message.js)
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MSG" || true

      - name: Send Telegram notification (failure)
        if: failure()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=⚠️ Daily Digest failed today. Run: https://github.com/pedalmeida/ai-digest/actions/runs/${{ github.run_id }}" || true
