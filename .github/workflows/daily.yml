name: Daily AI Digest

on:
  schedule:
    - cron: '0 7 * * *'  # 7am UTC = 8am Lisbon (WEST, UTC+1, Apr-Oct)
  workflow_dispatch:       # manual "Run workflow" button in GitHub UI

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm install

      - name: Fetch feed (X + podcasts + RSS + Hacker News + GitHub Trending)
        timeout-minutes: 8
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node scripts/fetch-my-feed.js

      - name: Debug feed contents
        run: |
          node -e "
            const d = JSON.parse(require('fs').readFileSync('my-feed.json', 'utf8'));
            console.log(JSON.stringify(d.stats));
            console.log(JSON.stringify(d.health));
          "

      - name: Generate digest (Claude Haiku 4.5)
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX:      ${{ secrets.GOOGLE_SEARCH_CX }}
          YOUTUBE_API_KEY:       ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -o pipefail
          trimmed_key="$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')"
          if [ -z "$trimmed_key" ]; then
            echo "::error::ANTHROPIC_API_KEY is empty. Add/rotate it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY is set (length ${#ANTHROPIC_API_KEY})"
          if [ -z "$GOOGLE_SEARCH_API_KEY" ] || [ -z "$GOOGLE_SEARCH_CX" ]; then
            echo "::warning::GOOGLE_SEARCH_API_KEY / GOOGLE_SEARCH_CX are empty; image fallback search will be skipped"
          fi
          cat my-feed.json | node scripts/remix-digest.js

      - name: Build reading page
        run: node scripts/generate-slides.js

      - name: Commit and push
        run: |
          git config user.name "AI Digest Bot"
          git config user.email "bot@ai-digest.local"
          git add index.html digest-draft.json state/seen.json
          git diff --staged --quiet || git commit -m "digest: $(date +%Y-%m-%d)"
          git push

      - name: Send Telegram notification (success)
        if: success()
        run: |
          MSG=$(node scripts/build-telegram-message.js)
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MSG" || true

      - name: Send Telegram notification (failure)
        if: failure()
        run: |
          {
            echo "⚠️ Daily Digest failed today."
            if [ -f .digest-error.txt ]; then cat .digest-error.txt; fi
            echo "Run: https://github.com/pedalmeida/ai-digest/actions/runs/${{ github.run_id }}"
          } | head -c 3500 | curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text@- || true
