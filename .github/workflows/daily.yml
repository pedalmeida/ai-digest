name: Daily AI Digest

on:
  schedule:
    - cron: '0 7 * * *'  # 7am UTC = 8am Lisbon (WEST, UTC+1, Apr-Oct)
  workflow_dispatch:       # manual "Run workflow" button in GitHub UI

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm install

      - name: Fetch feed (X + podcasts + RSS + Hacker News + GitHub Trending)
        timeout-minutes: 8
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node scripts/fetch-my-feed.js

      - name: Debug feed contents
        run: |
          node -e "
            const d = JSON.parse(require('fs').readFileSync('my-feed.json', 'utf8'));
            console.log(JSON.stringify(d.stats));
            console.log(JSON.stringify(d.health));
          "

      - name: Generate digest (Claude Haiku 4.5)
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX:      ${{ secrets.GOOGLE_SEARCH_CX }}
          YOUTUBE_API_KEY:       ${{ secrets.YOUTUBE_API_KEY }}
        run: cat my-feed.json | node scripts/remix-digest.js

      - name: Build reading page
        run: node scripts/generate-slides.js

      - name: Commit and push
        run: |
          git config user.name "AI Digest Bot"
          git config user.email "bot@ai-digest.local"
          git add index.html digest-draft.json state/seen.json
          git diff --staged --quiet || git commit -m "digest: $(date +%Y-%m-%d)"
          git push

      - name: Send Slack notification (success)
        if: success()
        env:
          SLACK_OPS_BOT_TOKEN: ${{ secrets.SLACK_OPS_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          MSG=$(node scripts/build-telegram-message.js)
          node - "$MSG" <<'NODE'
          const [,, text] = process.argv;
          const https = require('https');
          const body = JSON.stringify({ channel: process.env.SLACK_CHANNEL_ID, text, unfurl_links: false, unfurl_media: false });
          const req = https.request('https://slack.com/api/chat.postMessage', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${process.env.SLACK_OPS_BOT_TOKEN}`, 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
          }, res => {
            let data = ''; res.on('data', c => data += c); res.on('end', () => {
              const result = JSON.parse(data);
              if (!result.ok) { console.error(data); process.exit(1); }
            });
          });
          req.on('error', err => { console.error(err); process.exit(1); });
          req.write(body); req.end();
          NODE

      - name: Send Slack notification (failure)
        if: failure()
        env:
          SLACK_OPS_BOT_TOKEN: ${{ secrets.SLACK_OPS_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          node - <<'NODE'
          const https = require('https');
          const text = `⚠️ Daily Digest failed today. Run: https://github.com/pedalmeida/ai-digest/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const body = JSON.stringify({ channel: process.env.SLACK_CHANNEL_ID, text, unfurl_links: false, unfurl_media: false });
          const req = https.request('https://slack.com/api/chat.postMessage', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${process.env.SLACK_OPS_BOT_TOKEN}`, 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) }
          }, res => {
            let data = ''; res.on('data', c => data += c); res.on('end', () => {
              const result = JSON.parse(data);
              if (!result.ok) { console.error(data); process.exit(1); }
            });
          });
          req.on('error', err => { console.error(err); process.exit(1); });
          req.write(body); req.end();
          NODE
